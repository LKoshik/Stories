<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Stories · Koshik</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<!-- ============ LIBRARY VIEW ============ -->
<section id="view-library" class="view active">

  <header class="library-hero">
    <p class="kicker">A collection by Koshik</p>
    <h1>Stories</h1>
    <p class="library-intro">Slow-burn worlds, written one chapter at a time.</p>
  </header>

  <div class="story-grid" id="story-grid">
    <p class="reader-status">Loading stories…</p>
  </div>
</section>

<!-- ============ CHAPTERS VIEW ============ -->
<section id="view-chapters" class="view">

  <header class="chapters-header">
    <button class="btn btn-back" type="button" id="btn-to-library">← Library</button>
    <div class="chapters-heading">
      <h2 id="chapters-title"></h2>
      <p id="chapters-meta"></p>
    </div>
  </header>

  <ol class="chapter-list" id="chapter-list"></ol>
</section>

<!-- ============ READER VIEW ============ -->
<section id="view-reader" class="view">

  <header class="reader-header">
    <button class="btn btn-back" type="button" id="btn-to-chapters">← Chapters</button>
    <p class="reader-crumb" id="reader-crumb"></p>
  </header>

  <article class="reader-page">
    <h1 class="reader-title" id="reader-title"></h1>
    <div class="reader-body" id="reader-body"></div>
  </article>

  <footer class="reader-footer">
    <button class="btn btn-nav" type="button" id="btn-prev" disabled>← Previous</button>
    <button class="btn btn-nav" type="button" id="btn-next" disabled>Next →</button>
  </footer>
</section>

<script src="app.js" defer></script>
</body>
</html>
